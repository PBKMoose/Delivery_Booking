[project]
name = "delivery-booking-api"
version = "0.1.0"
description = "Delivery booking API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
# This is an application, not a library: don't build/install it as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]  # auto-generated migration files
